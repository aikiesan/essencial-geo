# Compila o site e publica no GitHub Pages a cada push na main.
# Em pull requests só compila — o que já valida o frontmatter de todos os mapas
# e a presença da versão em inglês (README.en.md) de cada mapa publicado.
#
# Agenda: mapas e notas com data futura ficam fora do site até as 12h UTC (9h em
# Brasília) do seu dia. A recompilação diária abaixo é o que os faz entrar no ar —
# um mapa novo por dia.
#
# Depois de publicar, o job "conferir" lê o site no ar e confere os mapas publicados:
# páginas PT/EN, sitemap, prancha e cada download. Se algo falhar, a execução falha e o
# GitHub avisa por e-mail. O resumo da execução lista os mapas prontos para receber DOI,
# com o comando do workflow "Publicar no Zenodo" (o DOI é sempre pedido à mão).
name: Site (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '5 12 * * *' # todo dia às 12h05 UTC = 9h05 em Brasília

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  conferir:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O GitHub Pages leva alguns segundos para servir a versão nova.
      - run: sleep 60
      - name: Conferir os mapas no ar
        run: node scripts/conferir-publicacao.mjs --todos
